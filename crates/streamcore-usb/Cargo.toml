[package]
name = "streamcore-usb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "StreamCore USB pipe providers: byte streams to a cabled device, handed to the secure transport."

[dependencies]
streamcore-transport = { path = "../streamcore-transport" }
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
uniffi = { workspace = true, optional = true }

[features]
# The binding surface for native apps (`ffi.rs`).
ffi = ["dep:uniffi"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "aoa_link"
required-features = ["ffi"]

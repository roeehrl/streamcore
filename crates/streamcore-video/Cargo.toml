[package]
name = "streamcore-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "StreamCore video control plane: backend traits, the per-stream serial executor, lifecycle, latest-frame retention and recovery fences."

[lib]
name = "streamcore_video"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
streamcore-media = { path = "../streamcore-media" }
uniffi.workspace = true
thiserror.workspace = true
async-trait = { workspace = true, optional = true }

[dev-dependencies]
rand.workspace = true

[features]
# The binding smoke surface (an async foreign trait round trip, 3.8). Built into the
# Apple test package; not part of the stream API.
ffi-probe = ["dep:async-trait"]
bindgen = ["uniffi/cli"]

[[bin]]
name = "streamcore-video-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[lints]
workspace = true

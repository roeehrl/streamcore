[package]
name = "streamcore-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "StreamCore secure transport: pinned identities, OPAQUE pairing, versioned hello, QUIC and TLS/TCP sessions and bounded multiplexed lanes."

[dependencies]
streamcore-media = { path = "../streamcore-media" }
uniffi.workspace = true
thiserror.workspace = true
rustls.workspace = true
rcgen.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
quinn.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
opaque-ke.workspace = true
argon2.workspace = true
rand.workspace = true
hmac.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Not `[lints] workspace = true`: `TCP_NOTSENT_LOWAT` needs one `setsockopt` call
# that neither std nor socket2 offers on Apple platforms. As in
# streamcore-input-ffi, unsafe stays denied crate-wide and is allowed only in
# `src/sockopt.rs`, with a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"

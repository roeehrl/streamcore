[workspace]
members = [
    "crates/streamcore-media",
    "crates/streamcore-session",
    "crates/streamcore-transport",
    "crates/streamcore-input",
    "crates/streamcore-input-ffi",
    "crates/streamcore-video",
    "crates/streamcore-video-windows",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
uniffi = "=0.32.2"
uuid = { version = "=1.27.0", features = ["serde"] }
thiserror = "=2.0.21"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.9.1"
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255", "argon2"] }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
rand = "=0.8.5"
hmac = "=0.12.1"
windows = "=0.62.2"
async-trait = "=0.1.92"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
